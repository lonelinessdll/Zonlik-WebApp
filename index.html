<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zonlik Bot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            color: #ffffff;
            padding: 16px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 400px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 24px;
        }
        
        .header h1 {
            font-size: 24px;
            font-weight: 600;
            color: #2AABEE;
        }
        
        .card {
            background: #2c2c2c;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
        }
        
        .profile-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #3a3a3a;
        }
        
        .profile-row:last-child {
            border-bottom: none;
        }
        
        .profile-label {
            color: #888;
            font-size: 14px;
        }
        
        .profile-value {
            font-weight: 500;
            font-size: 16px;
        }
        
        .balance {
            font-size: 32px;
            font-weight: 700;
            color: #4CAF50;
            text-align: center;
            margin: 16px 0;
        }
        
        .input-group {
            margin-bottom: 16px;
        }
        
        .input-label {
            display: block;
            margin-bottom: 8px;
            color: #888;
            font-size: 14px;
        }
        
        .input-field {
            width: 100%;
            padding: 14px 16px;
            background: #1a1a1a;
            border: 1px solid #3a3a3a;
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            outline: none;
        }
        
        .input-field:focus {
            border-color: #2AABEE;
        }
        
        .button {
            width: 100%;
            padding: 16px;
            background: #2AABEE;
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 12px;
        }
        
        .button:active {
            opacity: 0.8;
        }
        
        .button.secondary {
            background: #2c2c2c;
        }
        
        .info-text {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-top: 12px;
        }
        
        .ref-link {
            background: #1a1a1a;
            padding: 14px;
            border-radius: 12px;
            font-size: 13px;
            word-break: break-all;
            margin: 16px 0;
            border: 1px solid #3a3a3a;
        }
        
        .copy-btn {
            padding: 12px;
            background: #2c2c2c;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 16px 0;
        }
        
        .stat-card {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 16px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: #2AABEE;
        }
        
        .stat-label {
            font-size: 12px;
            color: #888;
            margin-top: 4px;
        }
        
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 1000;
        }
        
        .toast.show {
            opacity: 1;
        }
        
        .success-message {
            background: #4CAF50;
            color: white;
            padding: 16px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 16px;
        }
        
        .error-message {
            background: #f44336;
            color: white;
            padding: 16px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 Zonlik Bot</h1>
        </div>
        
        <div id="message-container"></div>
        
        <div class="card">
            <div class="profile-row">
                <span class="profile-label">🆔 Внутренний ID</span>
                <span class="profile-value" id="internal-id">—</span>
            </div>
            <div class="profile-row">
                <span class="profile-label">👤 Telegram ID</span>
                <span class="profile-value" id="telegram-id">—</span>
            </div>
            <div class="profile-row">
                <span class="profile-label">📛 Имя</span>
                <span class="profile-value" id="user-name">—</span>
            </div>
            
            <div class="balance">
                <span id="user-balance">0.00</span> ₽
            </div>
        </div>
        
        <div class="card">
            <h3 style="margin-bottom: 16px;">📤 Вывод средств</h3>
            
            <div class="input-group">
                <label class="input-label">💵 Сумма (мин. 15 ₽)</label>
                <input type="number" id="withdraw-amount" class="input-field" placeholder="Введите сумму" min="15" step="1" value="15">
            </div>
            
            <div class="input-group">
                <label class="input-label">💳 Номер карты</label>
                <input type="text" id="withdraw-card" class="input-field" placeholder="4276 XXXX XXXX XXXX">
            </div>
            
            <button class="button" onclick="submitWithdraw()">
                📤 Отправить заявку на вывод
            </button>
            
            <div class="info-text">
                Заявка будет обработана администратором
            </div>
        </div>
        
        <div class="card">
            <h3 style="margin-bottom: 16px;">📊 Статистика</h3>
            
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="total-earned">0</div>
                    <div class="stat-label">💵 Заработано</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="total-withdrawn">0</div>
                    <div class="stat-label">📤 Выведено</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="referral-count">0</div>
                    <div class="stat-label">👥 Рефералов</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="referral-earned">0</div>
                    <div class="stat-label">💰 С рефералов</div>
                </div>
            </div>
        </div>
        
        <div class="card">
            <h3 style="margin-bottom: 16px;">🔗 Реферальная система</h3>
            
            <div class="ref-link" id="ref-link">Загрузка...</div>
            
            <button class="copy-btn" onclick="copyRefLink()">📋 Копировать ссылку</button>
            
            <div class="info-text" style="margin-top: 16px;">
                +2 ₽ за каждого друга, прошедшего проверку
            </div>
        </div>
        
        <button class="button secondary" onclick="window.close()">
            ✖️ Закрыть
        </button>
    </div>
    
    <div class="toast" id="toast">Скопировано!</div>
    
    <script>
        // Получаем параметры из URL
        const urlParams = new URLSearchParams(window.location.search);
        const internalId = urlParams.get('id');
        const balance = parseFloat(urlParams.get('balance')) || 0;
        const totalEarned = parseFloat(urlParams.get('earned')) || 0;
        const totalWithdrawn = parseFloat(urlParams.get('withdrawn')) || 0;
        const referralCount = parseInt(urlParams.get('ref_count')) || 0;
        const referralEarned = parseFloat(urlParams.get('ref_earned')) || 0;
        const refLink = urlParams.get('ref_link') || '';
        const telegramId = urlParams.get('tg_id') || '—';
        const userName = urlParams.get('name') || '—';
        
        // Отображаем данные
        document.getElementById('internal-id').textContent = internalId || '—';
        document.getElementById('telegram-id').textContent = telegramId;
        document.getElementById('user-name').textContent = decodeURIComponent(userName);
        document.getElementById('user-balance').textContent = balance.toFixed(2);
        document.getElementById('total-earned').textContent = totalEarned.toFixed(0);
        document.getElementById('total-withdrawn').textContent = totalWithdrawn.toFixed(0);
        document.getElementById('referral-count').textContent = referralCount;
        document.getElementById('referral-earned').textContent = referralEarned.toFixed(0);
        
        if (refLink) {
            document.getElementById('ref-link').textContent = refLink;
        } else if (internalId) {
            document.getElementById('ref-link').textContent = `https://t.me/zonlik_bot?start=ref${internalId}`;
        }
        
        // Функция отправки заявки на вывод
        function submitWithdraw() {
            const amount = parseFloat(document.getElementById('withdraw-amount').value);
            const card = document.getElementById('withdraw-card').value.trim();
            
            if (!amount || amount < 15) {
                showMessage('❌ Минимальная сумма вывода: 15 ₽', 'error');
                return;
            }
            
            if (amount > balance) {
                showMessage('❌ Недостаточно средств на балансе', 'error');
                return;
            }
            
            if (!card) {
                showMessage('❌ Укажите номер карты', 'error');
                return;
            }
            
            // Формируем ссылку для возврата в бота
            const data = JSON.stringify({
                action: 'withdraw',
                amount: amount,
                card: card,
                internal_id: internalId
            });
            
            // Открываем ссылку с данными
            const botUrl = `https://t.me/zonlik_bot?start=withdraw_${btoa(data)}`;
            
            showMessage('✅ Заявка сформирована! Нажмите кнопку ниже чтобы отправить', 'success');
            
            // Создаём кнопку для отправки
            const container = document.getElementById('message-container');
            container.innerHTML = `
                <div class="success-message">
                    ✅ Заявка на ${amount} ₽ готова!
                </div>
                <a href="${botUrl}" style="text-decoration: none;">
                    <button class="button" style="background: #4CAF50;">
                        📤 Отправить заявку боту
                    </button>
                </a>
            `;
            
            // Скроллим вверх
            window.scrollTo(0, 0);
        }
        
        // Показ сообщений
        function showMessage(text, type) {
            const container = document.getElementById('message-container');
            container.innerHTML = `<div class="${type}-message">${text}</div>`;
            
            setTimeout(() => {
                container.innerHTML = '';
            }, 3000);
        }
        
        // Копирование ссылки
        function copyRefLink() {
            const link = document.getElementById('ref-link').textContent;
            
            navigator.clipboard?.writeText(link).then(() => {
                showToast('📋 Ссылка скопирована!');
            }).catch(() => {
                const textarea = document.createElement('textarea');
                textarea.value = link;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showToast('📋 Ссылка скопирована!');
            });
        }
        
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }
    </script>
</body>
</html>
