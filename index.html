<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zonlik Bot</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 16px;
            background: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
        }
        .profile {
            padding: 16px;
            border-radius: 12px;
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
        }
        .button {
            width: 100%;
            padding: 14px;
            margin-top: 16px;
            border: none;
            border-radius: 8px;
            background: var(--tg-theme-button-color, #2AABEE);
            color: var(--tg-theme-button-text-color, #fff);
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="profile">
        <h3>👤 Профиль</h3>
        <p>🆔 ID: <span id="user-id">...</span></p>
        <p>📛 Имя: <span id="user-name">...</span></p>
        <p>💰 Баланс: <span id="user-balance">...</span> ₽</p>
    </div>
    
    <button class="button" onclick="requestWithdraw()">📤 Запросить вывод</button>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand(); // Разворачиваем на весь экран
        
        const user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById('user-id').textContent = user.id;
            document.getElementById('user-name').textContent = user.first_name;
        }
        
        // Функция для получения баланса (нужно будет доработать)
        function loadBalance() {
            // Здесь можно сделать запрос к твоему API
            document.getElementById('user-balance').textContent = '0.00';
        }
        
        function requestWithdraw() {
            tg.sendData(JSON.stringify({
                action: 'withdraw_request',
                amount: 100
            }));
        }
        
        loadBalance();
    </script>
</body>
</html>
