<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ХИМИК · ПАНЕЛЬКА</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Courier New', monospace;
            background: #0d0d0d;
            color: #b0b0b0;
            padding: 12px;
            min-height: 100vh;
        }
        
        .game-container {
            max-width: 450px;
            margin: 0 auto;
        }
        
        /* Стиль панельки */
        .panel {
            background: #1a1a1a;
            border: 2px solid #333;
            margin-bottom: 10px;
            padding: 14px;
            box-shadow: 3px 3px 0 #0a0a0a;
        }
        
        .panel-title {
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #8B0000;
            margin-bottom: 12px;
            border-bottom: 1px solid #333;
            padding-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }
        
        .stat {
            background: #111;
            padding: 8px;
            border: 1px solid #2a2a2a;
        }
        
        .stat-label {
            font-size: 10px;
            color: #666;
            text-transform: uppercase;
        }
        
        .stat-value {
            font-size: 18px;
            font-weight: bold;
            color: #c0c0c0;
        }
        
        .stat-value.danger {
            color: #8B0000;
        }
        
        .stat-value.success {
            color: #2e7d32;
        }
        
        .button {
            background: #222;
            border: 1px solid #444;
            color: #ccc;
            padding: 12px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 6px;
            transition: all 0.1s;
        }
        
        .button:hover {
            background: #2a2a2a;
            border-color: #666;
        }
        
        .button.primary {
            background: #2a0a0a;
            border-color: #8B0000;
            color: #ff6666;
        }
        
        .button.danger {
            background: #1a0a0a;
            border-color: #660000;
        }
        
        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }
        
        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 10px;
        }
        
        .tab {
            flex: 1;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #888;
            padding: 10px;
            text-align: center;
            font-size: 11px;
            text-transform: uppercase;
            cursor: pointer;
        }
        
        .tab.active {
            background: #2a2a2a;
            color: #ccc;
            border-bottom: 2px solid #8B0000;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .recipe-list {
            max-height: 400px;
            overflow-y: auto;
        }
        
        .recipe-item {
            background: #151515;
            border: 1px solid #2a2a2a;
            padding: 10px;
            margin-bottom: 6px;
        }
        
        .recipe-name {
            font-size: 14px;
            font-weight: bold;
            color: #c0c0c0;
            display: flex;
            justify-content: space-between;
        }
        
        .recipe-desc {
            font-size: 11px;
            color: #777;
            margin-top: 4px;
        }
        
        .recipe-ingredients {
            font-size: 10px;
            color: #555;
            margin-top: 6px;
        }
        
        .inventory-item {
            display: flex;
            justify-content: space-between;
            padding: 6px;
            border-bottom: 1px solid #2a2a2a;
            font-size: 12px;
        }
        
        .client-card {
            background: #151515;
            border-left: 3px solid #8B0000;
            padding: 12px;
            margin-bottom: 10px;
        }
        
        .client-name {
            font-size: 14px;
            font-weight: bold;
            color: #c0c0c0;
        }
        
        .client-story {
            font-size: 11px;
            color: #666;
            margin: 6px 0;
            font-style: italic;
        }
        
        .client-stats {
            display: flex;
            gap: 12px;
            font-size: 10px;
            color: #555;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            padding: 20px;
            overflow-y: auto;
        }
        
        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .modal-content {
            background: #1a1a1a;
            border: 2px solid #8B0000;
            padding: 20px;
            max-width: 400px;
            width: 100%;
        }
        
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a1a1a;
            border: 1px solid #444;
            padding: 12px 20px;
            font-size: 12px;
            text-transform: uppercase;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 2000;
        }
        
        .toast.show {
            opacity: 1;
        }
        
        .heat-bar {
            width: 100%;
            height: 8px;
            background: #111;
            border: 1px solid #333;
            margin-top: 4px;
        }
        
        .heat-fill {
            height: 100%;
            background: #8B0000;
            width: 0%;
        }
        
        .active-cook {
            background: #1a0a0a;
            border: 1px solid #660000;
            padding: 8px;
            margin-bottom: 6px;
            font-size: 11px;
        }
        
        .timer {
            color: #ff6666;
        }
        
        input, select {
            width: 100%;
            background: #111;
            border: 1px solid #444;
            color: #ccc;
            padding: 10px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            margin-bottom: 10px;
        }
        
        label {
            font-size: 11px;
            color: #666;
            text-transform: uppercase;
            display: block;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <!-- Статус-бар -->
        <div class="panel">
            <div class="panel-title">
                <span>🧪 ХИМИК v2.0</span>

                </div>
                <div class="stat">

                    <div class="stat-value" id="reputation">50</div>
                </div>
            </div>
        </div>
        
        <!-- Табы -->

            <div class="tab active" data-tab="cook">🧪 ВАРКА</div>
            <div class="tab" data-tab="inventory">📦 СКЛАД</div>
            <div class="tab" data-tab="clients">👥 КЛИЕНТЫ</div>
            <div class="tab" data-tab="upgrade">🏚️ АПГРЕЙД</div>
        </div>
        
        <!-- Варка -->

                </div>
            </div>
            
            <div class="panel">

                <div class="button-group">
                    <button class="button" data-filter="all">ВСЕ</button>
                    <button class="button" data-filter="light">🌿 ЛЁГКИЕ</button>
                    <button class="button" data-filter="medium">💊 СРЕДНИЕ</button>
                    <button class="button" data-filter="heavy">🔮 ТЯЖЁЛЫЕ</button>
                    <button class="button" data-filter="pharma">🏥 АПТЕЧНЫЕ</button>
                    <button class="button" data-filter="designer">🧬 ДИЗАЙНЕРСКИЕ</button>
                </div>
                <div class="recipe-list" id="recipe-list"></div>
            </div>
        </div>
        
        <!-- Склад -->
        <div class="tab-content" id="tab-inventory">
            <div class="panel">
                <div class="panel-title">📦 ИНГРЕДИЕНТЫ</div>
                <div id="ingredients-list"></div>
            </div>
            <div class="panel">
                <div class="panel-title">💊 ГОТОВЫЙ ТОВАР</div>
                <div id="products-list"></div>
            </div>
            <div class="panel">
                <button class="button primary" id="buy-ingredients-btn">🛒 ЗАКУПИТЬСЯ У БАРЫГИ</button>
                <button class="button" id="sell-all-btn">💰 СБЫТ ВСЁ</button>
            </div>
        </div>
        
        <!-- Клиенты -->
        <div class="tab-content" id="tab-clients">
            <div class="panel">
                <div class="panel-title">👥 ПОСТОЯННЫЕ</div>
                <div id="clients-list"></div>
            </div>
            <div class="panel">
                <button class="button primary" id="wait-client-btn">🚪 ЖДАТЬ КЛИЕНТА</button>
                <button class="button" id="client-stories-btn">📖 ИСТОРИИ</button>
            </div>
        </div>
        
        <!-- Апгрейд -->
        <div class="tab-content" id="tab-upgrade">
            <div class="panel">
                <div class="panel-title">🏚️ УРОВЕНЬ ЛАБОРАТОРИИ</div>
                <div id="lab-info"></div>
                <button class="button primary" id="upgrade-lab-btn">⬆️ УЛУЧШИТЬ</button>
            </div>
            <div class="panel">
                <div class="panel-title">👔 ПЕРСОНАЛ</div>
                <div id="staff-list"></div>
            </div>
            <div class="panel">
                <div class="panel-title">📊 СТАТИСТИКА</div>
                <div id="game-stats"></div>
            </div>
        </div>
    </div>
    
    <!-- Модалка покупки -->
    <div class="modal" id="buy-modal">
        <div class="modal-content">
            <div class="panel-title">🛒 БАРЫГА</div>
            <div id="buy-list"></div>
            <button class="button" id="close-buy-modal">ЗАКРЫТЬ</button>
        </div>
    </div>
    
    <!-- Модалка клиента -->

            </div>
        </div>
    </div>
    
    <!-- Тосты -->

        // Уровни лаборатории
        const LAB_LEVELS = {

        };
        
        // Клиенты
        const CLIENTS = [
            { name: 'Макс «Пепел»', story: 'Блэк-металлист. Группа «Хтонь». Нужны спиды для записи.', prefers: ['amphetamine', 'methamphetamine'] },
            { name: 'Варя «Морг»', story: 'Готесса. Работает в морге. За коксом или герычем.', prefers: ['cocaine', 'heroin'] },

            { name: 'Кир «Струна»', story: 'Панк из «Гнилых Зубов». План и экстази.', prefers: ['weed', 'mdma'] },
            { name: 'Соня «Паутина»', story: 'Эмо-девочка. Режет руки. Колёса.', prefers: ['xanax', 'codeine_syrup'] },
            { name: 'Лёша «Бит»', story: 'Драммер «Электро-труп». Кристаллы.', prefers: ['methamphetamine', 'mdpv'] },
            { name: 'Антон «Доцент»', story: 'Бывший учитель. Героин.', prefers: ['heroin', 'fentanyl_citrate'] },
            { name: 'Лена «Королева»', story: 'Бывшая модель. Кокс.', prefers: ['cocaine', 'crack'] },
            { name: 'Влад «Клавиша»', story: 'Синти-поп. Радуга.', prefers: ['lsd', 'mdma'] },
            { name: 'Шестой', story: 'Бывший снайпер. Зомби.', prefers: ['mdpv', 'a_pvp'] },
            { name: 'Без Имени', story: 'Не помнит кто он. Зомби.', prefers: ['a_pvp', 'desomorphine'] },
            { name: 'Толян «Мотор»', story: 'Автомеханик. Крокодил.', prefers: ['desomorphine', 'tramadol_pills'] }
        ];
        
        // Состояние игры
        let gameState = {
            userId: null,
            userName: null,
            balance: 0,
            labLevel: 1,
            heat: 0,
            reputation: 50,
            inventory: {},
            activeCooks: [],
            clients: [],
            staff: {},
            stats: { earned: 0, sold: 0, cooked: 0 }
        };
        
        let currentFilter = 'all';
        let currentClient = null;
        let pendingSale = null;
        
        // ==============================================
        // ИНИЦИАЛИЗАЦИЯ
        // ==============================================
        
        function init() {
            loadFromURL();
            loadFromStorage();
            updateUI();
            renderRecipes();
            renderInventory();
            renderClients();
            renderLabInfo();
            renderStaff();
            startTimers();
        }
        
        function loadFromURL() {
            const params = new URLSearchParams(window.location.search);
            gameState.userId = params.get('id') || '?';
            gameState.userName = params.get('name') ? decodeURIComponent(params.get('name')) : 'Химик';
            gameState.balance = parseFloat(params.get('balance')) || 0;
            gameState.labLevel = parseInt(params.get('lab')) || 1;
            gameState.heat = parseInt(params.get('heat')) || 0;
            gameState.reputation = parseInt(params.get('rep')) || 50;
            
            document.getElementById('user-id').textContent = `ID: ${gameState.userId}`;
        }
        
        function loadFromStorage() {
            const saved = localStorage.getItem(`chemist_${gameState.userId}`);
            if (saved) {
                const data = JSON.parse(saved);
                gameState.inventory = data.inventory || {};
                gameState.activeCooks = data.activeCooks || [];
                gameState.clients = data.clients || [];
                gameState.staff = data.staff || {};
                gameState.stats = data.stats || { earned: 0, sold: 0, cooked: 0 };
            }
            
            // Стартовые ингредиенты
            if (Object.keys(gameState.inventory).length === 0) {
                gameState.inventory = {
                    seeds: 20, soil: 2, codeine: 10, ephedrine: 5,
                    red_phosphorus: 1, iodine: 1, acetone: 3
                };
            }
        }
        
        function saveToStorage() {
            localStorage.setItem(`chemist_${gameState.userId}`, JSON.stringify({
                inventory: gameState.inventory,
                activeCooks: gameState.activeCooks,
                clients: gameState.clients,
                staff: gameState.staff,
                stats: gameState.stats
            }));
        }
        
        // ==============================================
        // UI ОБНОВЛЕНИЕ
        // ==============================================
        
        function updateUI() {
            document.getElementById('balance').textContent = `${gameState.balance.toFixed(2)} ₽`;
            document.getElementById('lab-level').textContent = LAB_LEVELS[gameState.labLevel].name;
            document.getElementById('heat').textContent = `${gameState.heat}%`;
            document.getElementById('heat-fill').style.width = `${gameState.heat}%`;
            document.getElementById('reputation').textContent = gameState.reputation;
            
            // Цвет тепла
            const heatEl = document.getElementById('heat');
            if (gameState.heat > 60) heatEl.style.color = '#ff3333';
            else if (gameState.heat > 30) heatEl.style.color = '#ff9900';
            else heatEl.style.color = '#c0c0c0';
        }
        
        // ==============================================
        // РЕНДЕР РЕЦЕПТОВ
        // ==============================================
        
        function renderRecipes() {
            const container = document.getElementById('recipe-list');
            let html = '';
            
            for (const [id, r] of Object.entries(RECIPES)) {
                if (currentFilter !== 'all' && r.type !== currentFilter) continue;
                
                const canCook = checkIngredients(r.ingredients);
                const ingText = Object.entries(r.ingredients).map(([k, v]) => 
                    `${INGREDIENTS[k]?.name || k}: ${v}`
                ).join(', ');
                
                html += `
                    <div class="recipe-item" style="opacity: ${canCook ? 1 : 0.6}">
                        <div class="recipe-name">
                            <span>${r.name}</span>
                            <span>${r.time}ч | ${r.price}₽</span>
                        </div>
                        <div class="recipe-desc">${r.desc}</div>
                        <div class="recipe-ingredients">📦 ${ingText}</div>
                        <div style="margin-top: 8px;">
                            <button class="button" onclick="startCook('${id}')" ${!canCook ? 'disabled' : ''}>
                                🧪 ВАРИТЬ (🔥+${r.risk}%)
                            </button>
                        </div>
                    </div>
                `;
            }
            
            container.innerHTML = html || '<div style="color:#444;text-align:center">Нет рецептов</div>';
        }
        
        function checkIngredients(ings) {
            for (const [k, v] of Object.entries(ings)) {
                if ((gameState.inventory[k] || 0) < v) return false;
            }
            return true;
        }
        
        function startCook(recipeId) {
            const recipe = RECIPES[recipeId];
            
            // Проверка слотов
            if (gameState.activeCooks.length >= LAB_LEVELS[gameState.labLevel].slots) {
                showToast('❌ Нет свободных слотов!');
                return;
            }
            
            // Проверка ингредиентов
            if (!checkIngredients(recipe.ingredients)) {
                showToast('❌ Не хватает ингредиентов');
                return;
            }
            
            // Списываем ингредиенты
            for (const [k, v] of Object.entries(recipe.ingredients)) {
                gameState.inventory[k] = (gameState.inventory[k] || 0) - v;
            }
            
            // Добавляем варку
            const endTime = Date.now() + recipe.time * 3600000;
            gameState.activeCooks.push({
                id: Date.now() + Math.random(),
                recipeId,
                recipeName: recipe.name,
                endTime,
                risk: Math.floor(recipe.risk * LAB_LEVELS[gameState.labLevel].risk_mod)
            });
            
            // Увеличиваем тепло
            gameState.heat = Math.min(100, gameState.heat + recipe.risk);
            gameState.stats.cooked++;
            
            saveToStorage();
            updateUI();
            renderRecipes();
            renderInventory();
            renderActiveCooks();
            showToast(`✅ Варка запущена: ${recipe.name}`);
        }
        
        function renderActiveCooks() {
            const container = document.getElementById('active-cooks-container');
            const now = Date.now();
            
            const active = gameState.activeCooks.filter(c => c.endTime > now);
            const completed = gameState.activeCooks.filter(c => c.endTime <= now);
            
            // Завершаем готовые
            completed.forEach(c => completeCook(c));
            
            if (active.length === 0) {
                container.innerHTML = '<div style="color:#444;text-align:center;padding:10px;">Нет активных варок</div>';
                return;
            }
            
            let html = '';
            active.forEach(cook => {
                const remaining = cook.endTime - now;
                const hours = Math.floor(remaining / 3600000);
                const mins = Math.floor((remaining % 3600000) / 60000);
                
                html += `
                    <div class="active-cook">
                        <div><strong>${cook.recipeName}</strong></div>
                        <div class="timer">⏳ ${hours}ч ${mins}м</div>
                        <div style="color:#666;">🔥 +${cook.risk}%</div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
            gameState.activeCooks = active;
            saveToStorage();
        }
        
        function completeCook(cook) {
            const recipe = RECIPES[cook.recipeId];
            const [minY, maxY] = recipe.yield;
            const amount = Math.floor(Math.random() * (maxY - minY + 1)) + minY;
            
            gameState.inventory[cook.recipeId] = (gameState.inventory[cook.recipeId] || 0) + amount;
            showToast(`✅ ${recipe.name} готов! +${amount} ед.`);
        }
        
        // ==============================================
        // СКЛАД
        // ==============================================
        
        function renderInventory() {
            // Ингредиенты
            const ingContainer = document.getElementById('ingredients-list');
            let ingHtml = '';
            for (const [k, v] of Object.entries(gameState.inventory)) {
                if (INGREDIENTS[k] && v > 0) {
                    ingHtml += `
                        <div class="inventory-item">
                            <span>${INGREDIENTS[k].name}</span>
                            <span>${v} шт.</span>
                        </div>
                    `;
                }
            }
            ingContainer.innerHTML = ingHtml || '<div style="color:#444">Пусто</div>';
            
            // Продукты
            const prodContainer = document.getElementById('products-list');
            let prodHtml = '';
            for (const [k, v] of Object.entries(gameState.inventory)) {
                if (RECIPES[k] && v > 0) {
                    prodHtml += `
                        <div class="inventory-item">
                            <span>${RECIPES[k].name}</span>
                            <span>${v} ед. (${RECIPES[k].price}₽)</span>
                        </div>
                    `;
                }
            }
            prodContainer.innerHTML = prodHtml || '<div style="color:#444">Нет товара</div>';
        }
        
        function sellAll() {
            let total = 0;
            for (const [k, v] of Object.entries(gameState.inventory)) {
                if (RECIPES[k] && v > 0) {
                    total += RECIPES[k].price * v;
                    delete gameState.inventory[k];
                }
            }
            
            if (total === 0) {
                showToast('❌ Нечего продавать');
                return;
            }
            
            gameState.balance += total;
            gameState.stats.earned += total;
            gameState.stats.sold++;
            
            saveToStorage();
            updateUI();
            renderInventory();
            showToast(`💰 Продано на ${total.toFixed(2)} ₽`);
            
            // Отправляем данные боту
            syncWithBot('sell', total);
        }
        
        // ==============================================
        // КЛИЕНТЫ
        // ==============================================
        
        function renderClients() {
            const container = document.getElementById('clients-list');
            if (gameState.clients.length === 0) {
                container.innerHTML = '<div style="color:#444;text-align:center;">Нет постоянных клиентов</div>';
                return;
            }
            
            let html = '';
            gameState.clients.slice(0, 5).forEach(c => {
                html += `
                    <div class="client-card">
                        <div class="client-name">${c.name}</div>
                        <div class="client-story">${c.story}</div>
                        <div class="client-stats">
                            <span>❤️ ${c.health}%</span>
                            <span>💊 ${c.addiction}%</span>
                            <span>⭐ ${c.loyalty}</span>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }
        
        function waitClient() {
            const client = CLIENTS[Math.floor(Math.random() * CLIENTS.length)];
            
            // Ищем товар для клиента
            let available = [];
            for (const pref of client.prefers) {
                if ((gameState.inventory[pref] || 0) > 0) {
                    available.push(pref);
                }
            }
            
            if (available.length === 0) {
                showToast(`❌ ${client.name} ушёл — нет товара`);
                return;
            }
            
            const productId = available[Math.floor(Math.random() * available.length)];
            const recipe = RECIPES[productId];
            const amount = Math.min(3, gameState.inventory[productId]);
            const price = recipe.price * amount;
            
            currentClient = client;
            pendingSale = { productId, amount, price };
            
            // Показываем модалку
            document.getElementById('client-modal-title').textContent = client.name;
            document.getElementById('client-modal-content').innerHTML = `
                <p style="margin-bottom:10px;"><em>"${client.story}"</em></p>
                <p>Хочет купить: <strong>${recipe.name}</strong> (${amount} ед.)</p>
                <p>Предлагает: <strong style="color:#2e7d32;">${price} ₽</strong></p>
                <p style="color:#666;margin-top:10px;">❤️ Зависимость: ${Math.floor(Math.random()*50+30)}%</p>
            `;
            document.getElementById('client-modal').classList.add('active');
        }
        
        function sellToClient() {
            if (!pendingSale) return;
            
            const { productId, amount, price } = pendingSale;
            
            if ((gameState.inventory[productId] || 0) < amount) {
                showToast('❌ Товар пропал');
                closeModal();
                return;
            }
            
            gameState.inventory[productId] -= amount;
            gameState.balance += price;
            gameState.reputation = Math.min(100, gameState.reputation + 2);
            gameState.stats.earned += price;
            
            // Добавляем клиента в постоянные
            const existing = gameState.clients.find(c => c.name === currentClient.name);
            if (existing) {
                existing.addiction = Math.min(100, existing.addiction + 5);
                existing.loyalty += 2;
            } else {
                gameState.clients.push({
                    ...currentClient,
                    health: 80,
                    addiction: 30,
                    loyalty: 50
                });
            }
            
            saveToStorage();
            updateUI();
            renderInventory();
            renderClients();
            closeModal();
            showToast(`✅ Продано за ${price} ₽! Репутация +2`);
            syncWithBot('sell', price);
        }
        
        function closeModal() {
            document.getElementById('client-modal').classList.remove('active');
            document.getElementById('buy-modal').classList.remove('active');
            currentClient = null;
            pendingSale = null;
        }
        
        // ==============================================
        // АПГРЕЙД
        // ==============================================
        
        function renderLabInfo() {
            const info = LAB_LEVELS[gameState.labLevel];
            const next = LAB_LEVELS[gameState.labLevel + 1];
            
            document.getElementById('lab-info').innerHTML = `
                <div class="inventory-item"><span>Уровень</span><span>${gameState.labLevel} — ${info.name}</span></div>
                <div class="inventory-item"><span>Слотов варки</span><span>${info.slots}</span></div>
                <div class="inventory-item"><span>Множитель риска</span><span>${(info.risk_mod * 100).toFixed(0)}%</span></div>
                ${next ? `<div class="inventory-item"><span>След. уровень</span><span>${next.upgrade_cost} ₽</span></div>` : ''}
            `;
            
            const btn = document.getElementById('upgrade-lab-btn');
            if (!next) {
                btn.disabled = true;
                btn.textContent = '🏆 МАКСИМУМ';
            } else if (gameState.balance < next.upgrade_cost) {
                btn.disabled = true;
                btn.textContent = `❌ НЕ ХВАТАЕТ ${next.upgrade_cost} ₽`;
            } else {
                btn.disabled = false;
                btn.textContent = `⬆️ УЛУЧШИТЬ ЗА ${next.upgrade_cost} ₽`;
            }
        }
        
        function upgradeLab() {
            const next = LAB_LEVELS[gameState.labLevel + 1];
            if (!next || gameState.balance < next.upgrade_cost) return;
            
            gameState.balance -= next.upgrade_cost;
            gameState.labLevel++;
            gameState.heat = Math.max(0, gameState.heat - 20);
            
            saveToStorage();
            updateUI();
            renderLabInfo();
            showToast(`✅ Лаборатория улучшена до ${LAB_LEVELS[gameState.labLevel].name}`);
        }
        
        function renderStaff() {
            const container = document.getElementById('staff-list');
            // Заглушка
            container.innerHTML = '<div style="color:#444;text-align:center;">Скоро...</div>';
        }
        
        function renderGameStats() {
            document.getElementById('game-stats').innerHTML = `
                <div class="inventory-item"><span>Всего сварено</span><span>${gameState.stats.cooked}</span></div>
                <div class="inventory-item"><span>Всего продаж</span><span>${gameState.stats.sold}</span></div>
                <div class="inventory-item"><span>Заработано</span><span>${gameState.stats.earned.toFixed(2)} ₽</span></div>
            `;
        }
        
        // ==============================================
        // ПОКУПКА ИНГРЕДИЕНТОВ
        // ==============================================
        
        function showBuyModal() {
            const container = document.getElementById('buy-list');
            let html = '';
            
            for (const [id, ing] of Object.entries(INGREDIENTS)) {
                html += `
                    <div class="inventory-item">
                        <span>${ing.name}</span>
                        <span>
                            ${ing.price} ₽
                            <button class="button" style="padding:4px 8px;width:auto;" onclick="buyIngredient('${id}')">КУПИТЬ</button>
                        </span>
                    </div>
                `;
            }
            
            container.innerHTML = html;
            document.getElementById('buy-modal').classList.add('active');
        }
        
        function buyIngredient(ingId) {
            const ing = INGREDIENTS[ingId];
            if (gameState.balance < ing.price) {
                showToast('❌ Не хватает денег');
                return;
            }
            
            gameState.balance -= ing.price;
            gameState.inventory[ingId] = (gameState.inventory[ingId] || 0) + 1;
            
            saveToStorage();
            updateUI();
            renderInventory();
            showToast(`✅ Куплено: ${ing.name}`);
        }
        
        // ==============================================
        // СИНХРОНИЗАЦИЯ С БОТОМ
        // ==============================================
        
        function syncWithBot(action, amount) {
            if (window.Telegram?.WebApp) {
                const tg = window.Telegram.WebApp;
                tg.sendData(JSON.stringify({
                    action: 'game_action',
                    type: action,
                    amount: amount,
                    balance: gameState.balance,
                    heat: gameState.heat,
                    reputation: gameState.reputation,
                    labLevel: gameState.labLevel
                }));
            }
        }
        
        // ==============================================
        // ТАЙМЕРЫ И ТОСТЫ
        // ==============================================
        
        function startTimers() {
            setInterval(() => {
                // Остывание тепла
                if (gameState.heat > 0) {
                    gameState.heat = Math.max(0, gameState.heat - 1);
                    updateUI();
                }
                renderActiveCooks();
            }, 60000); // Каждую минуту
            
            renderActiveCooks();
        }
        
        function showToast(text) {
            const toast = document.getElementById('toast');
            toast.textContent = text;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }
        
        // ==============================================
        // ТАБЫ
        // ==============================================
        
        function switchTab(tabId) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            document.querySelector(`[data-tab="${tabId}"]`).classList.add('active');
            document.getElementById(`tab-${tabId}`).classList.add('active');
            
            if (tabId === 'upgrade') {
                renderLabInfo();
                renderGameStats();
            }
        }
        
        // ==============================================
        // ОБРАБОТЧИКИ СОБЫТИЙ
        // ==============================================
        
        document.addEventListener('DOMContentLoaded', () => {
            init();
            
            // Табы
            document.querySelectorAll('.tab').forEach(t => {
                t.addEventListener('click', () => switchTab(t.dataset.tab));
            });
            
            // Фильтры рецептов
            document.querySelectorAll('[data-filter]').forEach(btn => {
                btn.addEventListener('click', () => {
                    currentFilter = btn.dataset.filter;
                    renderRecipes();
                });
            });
            
            // Кнопки
            document.getElementById('buy-ingredients-btn').addEventListener('click', showBuyModal);
            document.getElementById('sell-all-btn').addEventListener('click', sellAll);
            document.getElementById('wait-client-btn').addEventListener('click', waitClient);
            document.getElementById('upgrade-lab-btn').addEventListener('click', upgradeLab);
            document.getElementById('close-buy-modal').addEventListener('click', closeModal);
            document.getElementById('client-sell-btn').addEventListener('click', sellToClient);
            document.getElementById('client-decline-btn').addEventListener('click', () => {
                gameState.reputation = Math.max(0, gameState.reputation - 1);
                updateUI();
                closeModal();
                showToast('❌ Клиент ушёл. Репутация -1');
            });
            document.getElementById('client-stories-btn').addEventListener('click', () => {
                const client = CLIENTS[Math.floor(Math.random() * CLIENTS.length)];
                showToast(`${client.name}: "${client.story}"`);
            });
            
            // Telegram WebApp
            if (window.Telegram?.WebApp) {
                const tg = window.Telegram.WebApp;
                tg.ready();
                tg.expand();
                tg.enableClosingConfirmation();
                tg.MainButton.setText('💰 ВЫВЕСТИ');
                tg.MainButton.show();
                tg.MainButton.onClick(() => {
                    window.location.href = `https://t.me/zonlik_bot?start=withdraw_${btoa(JSON.stringify({
                        id: gameState.userId,
                        amount: gameState.balance
                    }))}`;
                });
            }
        });
        
        // Глобальные функции для onclick
        window.startCook = startCook;
        window.buyIngredient = buyIngredient;
    </script>
</body>
</html>
